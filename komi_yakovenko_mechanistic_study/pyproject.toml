[project]
name = "komi-yakovenko-mechanistic-study"
version = "0.1.0"
description = "Mechanistic study comparing Komi et al. (2026) spinal-projectome theory with Yakovenko et al. (2002) cat motoneuron locomotor organization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["src", "."]
