[project]
name = "yakovenko-2002-reproduction"
version = "0.1.0"
description = "Computational reproduction of Yakovenko et al. J Neurophysiol 2002 cat spinal motoneuron spatiotemporal model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.2.0",
    "openpyxl>=3.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["src", "."]
